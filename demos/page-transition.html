<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动效交互预览 · page-transition</title>
</head>
<body><main id="demo"></main>
<script>
function mountScene() {
  'use strict';
  const api = window.MotionDemo;
  const root = document.querySelector('#demo');
  const { node, button, feedback, shell, actions, note, menu, list, ad, drawer, addDrawerButton, row, titles } = window.MotionParts;
  api.mount(function transitionScene() {
    const parent = shell('向前，也记得来路。', '页面前进 / 返回与状态保留');
    const status = feedback(parent, '点击任意内容进入详情 · 返回略快');
    const stack = node('<div class="route-stack"><div class="route-page route-list"></div></div>'); parent.append(stack);
    const previous = stack.firstElementChild;
    let detail; let revision = 0; let counter = 0;
    async function back() {
      if (!detail) return;
      const current = ++revision; const outgoing = detail;
      const start = getComputedStyle(outgoing).transform; api.stop(outgoing); api.stop(previous);
      const results = await Promise.all([api.animate(outgoing, [{ transform: start }, { transform: 'translateX(var(--motion-page-distance))' }], '--motion-return'), api.animate(previous, [{ opacity: getComputedStyle(previous).opacity }, { opacity: 1 }], '--motion-return')]);
      if (current !== revision || results.some(done => !done)) return;
      outgoing.remove(); detail = null; previous.inert = false;
      status.textContent = '已返回 · 收藏次数与列表滚动位置保留';
    }
    const stateButton = button('收藏灵感：0', () => { counter++; stateButton.textContent = '收藏灵感：' + counter; }); previous.append(stateButton);
    for (let i = 0; i < 6; i++) {
      const item = row(i, true); previous.append(item);
      api.listen(item, 'click', () => {
        if (detail) return;
        const current = ++revision;
        detail = node('<div class="route-page route-detail"><button class="demo-button">← 返回</button><div class="detail-visual">✦</div><h2></h2><p>有时候，好的体验不是多做一点，而是让每一次变化，都顺理成章。</p><p>这里是独立的详情页面。回去后，上一页仍在原处。</p></div>');
        detail.querySelector('h2').textContent = titles[i]; stack.append(detail); previous.inert = true;
        api.listen(detail.querySelector('button'), 'click', back);
        api.animate(previous, [{ opacity: 1 }, { opacity: .65 }], '--motion-slow');
        api.animate(detail, [{ transform: 'translateX(var(--motion-page-distance))' }, { transform: 'translateX(0px)' }], '--motion-slow').then(done => { if (done && current === revision) status.textContent = '详情已打开 · 重复点击不会重复入栈'; });
      });
    }
    api.listen(document, 'keydown', event => { if (event.key === 'Escape' && detail) back(); });
    note(parent, '这里模拟网页转场；Flutter 系统返回手势与预测性返回仍需在真机验证。');
  });
}
  let started = false;
  function start() { if (!started) { started = true; mountScene(); } }
  function appendStyle(css) { const style = document.createElement('style'); style.textContent = css; document.head.append(style); }
  if (location.protocol === 'file:' && parent !== window) {
    function receive(event) {
      const data = event.data;
      if (event.source !== parent || data?.channel !== 'motion-library' || data.action !== 'shared-assets') return;
      const assets = data.assets;
      if (!assets || !['css', 'runtime', 'components'].every(key => typeof assets[key] === 'string')) return;
      window.removeEventListener('message', receive);
      appendStyle(assets.css);
      for (const source of [assets.runtime, assets.components]) {
        const script = document.createElement('script'); script.textContent = source; document.head.append(script);
      }
      start();
    }
    window.addEventListener('message', receive);
    parent.postMessage({ channel: 'motion-library', action: 'request-assets' }, '*');
  } else {
    const styles = ['../styles/motion-tokens.css', 'shared/demo.css'].map(href => new Promise((resolve, reject) => {
      const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = href; link.onload = resolve; link.onerror = reject; document.head.append(link);
    }));
    function load(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script'); script.src = src; script.onload = resolve; script.onerror = reject; document.head.append(script);
      });
    }
    Promise.all(styles).then(() => load('shared/runtime.js')).then(() => load('shared/components.js')).then(start).catch(() => {
      document.querySelector('#demo').textContent = '预览资源未能加载，请刷新重试。';
    });
  }
</script>
</body>
</html>
