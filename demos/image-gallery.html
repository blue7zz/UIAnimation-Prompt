<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>动效交互预览 · 图片切换</title></head>
<body><main id="demo"></main>
<script>
function mountScene() {
  'use strict';
  const api = window.MotionDemo;
  const root = document.querySelector('#demo');
  const { node, button, feedback, shell, actions, note, row, to, dragAxis, popup, choices } = window.MotionParts;
  api.mount(function () {
    const parent = shell('图片切换', '网页模拟 · 按钮、键盘与快速操作');
    const status = feedback(parent, '请操作下方示例，观察局部变化。');

    const photos = ['山', '海', '林']; let index = 0; let revision = 0;
    const photo = node('<div class="gallery-window" role="img" aria-label="山野示意图"><div class="gallery-strip" aria-hidden="true"><div>山</div><div>海</div><div>林</div></div></div>'); const count = node('<div class="gallery-count" role="status">1 / 3</div>'); parent.append(photo, count); const strip = photo.firstElementChild;
    const bar = actions(parent, [['上一张', () => change(index - 1)], ['下一张', () => change(index + 1)]]);
    function display(page) { photo.setAttribute('aria-label', ['山野', '海边', '森林'][page] + '示意图'); count.textContent = (page + 1) + ' / 3'; }
    photo.tabIndex = -1;
    function controls() { const focused = document.activeElement; bar.children[0].disabled = index === 0; bar.children[1].disabled = index === 2; if ([...bar.children].some(item => item === focused && item.disabled)) photo.focus({ preventScroll: true }); }
    async function change(next) {
      if (next < 0 || next > 2 || next === index) return; index = next; const current = ++revision; controls();
      const running = to(strip, { left: -index * photo.clientWidth + 'px' });
      function sample() { if (current !== revision || !strip.isConnected) return; display(Math.max(0, Math.min(2, Math.round(-parseFloat(getComputedStyle(strip).left) / photo.clientWidth)))); if (strip.getAnimations().length) api.later(sample, 16); }
      sample(); const done = await running; if (done && current === revision) display(index);
    }
    controls(); api.listen(window, 'resize', () => { ++revision; api.stop(strip); strip.style.left = -index * photo.clientWidth + 'px'; display(index); });
    note(parent, '页码跟随当前居中图片；目标到边界时仍可反向，所有示意图离线可用。');

  });
}

  let started = false;
  function start() { if (!started) { started = true; mountScene(); } }
  function appendStyle(css) { const style = document.createElement('style'); style.textContent = css; document.head.append(style); }
  if (location.protocol === 'file:' && parent !== window) {
    function receive(event) {
      const data = event.data;
      if (event.source !== parent || data?.channel !== 'motion-library' || data.action !== 'shared-assets') return;
      const assets = data.assets;
      if (!assets || !['css', 'runtime', 'components'].every(key => typeof assets[key] === 'string')) return;
      window.removeEventListener('message', receive);
      appendStyle(assets.css);
      for (const source of [assets.runtime, assets.components]) { const script = document.createElement('script'); script.textContent = source; document.head.append(script); }
      start();
    }
    window.addEventListener('message', receive);
    parent.postMessage({ channel: 'motion-library', action: 'request-assets' }, '*');
  } else {
    const styles = ['../styles/motion-tokens.css', 'shared/demo.css'].map(href => new Promise((resolve, reject) => {
      const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = href; link.onload = resolve; link.onerror = reject; document.head.append(link);
    }));
    function load(src) { return new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = src; script.onload = resolve; script.onerror = reject; document.head.append(script); }); }
    Promise.all(styles).then(() => load('shared/runtime.js')).then(() => load('shared/components.js')).then(start).catch(() => { document.querySelector('#demo').textContent = '预览资源未能加载，请刷新重试。'; });
  }
</script>
</body>
</html>
