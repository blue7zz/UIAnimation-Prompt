<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动效交互预览 · list-motion</title>
</head>
<body><main id="demo"></main>
<script>
function mountScene() {
  'use strict';
  const api = window.MotionDemo;
  const root = document.querySelector('#demo');
  const { node, button, feedback, shell, actions, note, menu, list, ad, drawer, addDrawerButton, row, titles } = window.MotionParts;
  api.mount(function listScene() {
    const parent = shell('更新，不必重来。', '首次入场 / 刷新 / 空与错');
    const bar = node('<div></div>'); parent.append(bar);
    const controller = list(parent, true);
    actions(bar, [['刷新', controller.refresh], ['空状态', controller.empty], ['错误', controller.error], ['内容', controller.content]]);
    note(parent, '刷新仅修改业务 ID 为 story-1 的行，其他 DOM 节点与滚动位置保持不变。');
  });
}
  let started = false;
  function start() { if (!started) { started = true; mountScene(); } }
  function appendStyle(css) { const style = document.createElement('style'); style.textContent = css; document.head.append(style); }
  if (location.protocol === 'file:' && parent !== window) {
    function receive(event) {
      const data = event.data;
      if (event.source !== parent || data?.channel !== 'motion-library' || data.action !== 'shared-assets') return;
      const assets = data.assets;
      if (!assets || !['css', 'runtime', 'components'].every(key => typeof assets[key] === 'string')) return;
      window.removeEventListener('message', receive);
      appendStyle(assets.css);
      for (const source of [assets.runtime, assets.components]) {
        const script = document.createElement('script'); script.textContent = source; document.head.append(script);
      }
      start();
    }
    window.addEventListener('message', receive);
    parent.postMessage({ channel: 'motion-library', action: 'request-assets' }, '*');
  } else {
    const styles = ['../styles/motion-tokens.css', 'shared/demo.css'].map(href => new Promise((resolve, reject) => {
      const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = href; link.onload = resolve; link.onerror = reject; document.head.append(link);
    }));
    function load(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script'); script.src = src; script.onload = resolve; script.onerror = reject; document.head.append(script);
      });
    }
    Promise.all(styles).then(() => load('shared/runtime.js')).then(() => load('shared/components.js')).then(start).catch(() => {
      document.querySelector('#demo').textContent = '预览资源未能加载，请刷新重试。';
    });
  }
</script>
</body>
</html>
